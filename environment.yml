name: eco629
channels:
  - conda-forge
dependencies:
  - python >=3.11
  # Jupyter Book 2 / MyST engine (pulls in nodejs, ipykernel, jupyter_server)
  - jupyter-book >=2
  # Kernel, server and JupyterLab used to run the code cells
  - ipykernel
  - jupyter_server
  - jupyterlab
  # Scientific stack used by the lecture code
  - numpy
  - pandas
  - scipy
  - matplotlib
  - sympy
  # line-by-line profiling in the NFXP practical
  - line_profiler
  # optimization, and maximum likelihood with inference (estimagic), in the CCP practical
  - optimagic
